<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Gracias por tu compra! — Gáldar FS Store</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%95%3C/text%3E%3C/svg%3E" />
  <style>
    .thanks{min-height:100dvh;display:grid;place-items:center;text-align:center;
      background:radial-gradient(1200px 500px at 50% -10%,var(--navy-2),var(--navy));color:#fff;padding:2rem}
    .thanks .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
      border-radius:24px;padding:3rem 2.4rem;max-width:520px}
    .thanks .tick{width:78px;height:78px;border-radius:50%;background:var(--ok);display:grid;place-items:center;
      margin:0 auto 1.4rem;font-size:2.4rem}
    .thanks h1{font-size:2rem}
    .thanks p{color:#cdd6ea;margin:.4rem 0 1.6rem}
  </style>
</head>
<body>
  <main class="thanks">
    <div class="card">
      <div class="tick">✓</div>
      <h1>¡Gracias por tu pedido!</h1>
      <p>Hemos recibido tu compra. Si el pago con PayPal se ha completado correctamente,
         prepararemos tu envío. Recibirás la confirmación en tu email.</p>
      <a href="/" class="btn btn-primary">Volver a la tienda</a>
    </div>
  </main>
</body>
</html>
