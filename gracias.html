<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido recibido — AIMX Esports</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a0a0b'/%3E%3Ctext x='50' y='70' text-anchor='middle' font-size='52' font-family='Arial Black,sans-serif' font-weight='900' fill='%23fff'%3EA%3C/text%3E%3Ccircle cx='78' cy='66' r='6' fill='%23e50914'/%3E%3C/svg%3E" />
  <style>
    .thanks{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:2rem;
      background:radial-gradient(900px 500px at 50% 20%,rgba(229,9,20,.25),transparent 60%),var(--bg)}
    .thanks .card{background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:3rem 2.4rem;max-width:520px}
    .thanks .tick{width:74px;height:74px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin:0 auto 1.4rem;font-size:2.2rem;box-shadow:0 8px 24px var(--red-glow)}
    .thanks p{color:var(--muted);margin:.4rem 0 1.6rem}
  </style>
</head>
<body>
  <main class="thanks">
    <div class="card">
      <div class="tick">✓</div>
      <p class="eyebrow">AIMX SHOP</p>
      <h1 class="display sm"><span class="w">PEDIDO</span> <span class="r">RECIBIDO</span></h1>
      <p>Hemos recibido tu pedido. Si el pago con PayPal se completó correctamente, prepararemos tu envío. Recibirás la confirmación en tu email.</p>
      <a href="/" class="btn btn-red">VOLVER A LA TIENDA</a>
    </div>
  </main>
</body>
</html>
